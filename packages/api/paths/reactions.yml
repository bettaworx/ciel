/posts/{postId}/reactions:
  get:
    tags:
    - Reactions
    summary: Get reaction counts for a post
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/PostId
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/reactions.yml#/components/schemas/ReactionCounts
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
  post:
    tags:
    - Reactions
    summary: Add a reaction
    description: One user can add a specific emoji once per post.
    security:
    - bearerAuth: []
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/PostId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/reactions.yml#/components/schemas/ReactRequest
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema:
              $ref: ../schemas/reactions.yml#/components/schemas/ReactionCounts
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '409':
        description: Already reacted with that emoji
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Reactions
    summary: Remove a reaction
    security:
    - bearerAuth: []
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/PostId
    - name: emoji
      in: query
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Emoji
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema:
              $ref: ../schemas/reactions.yml#/components/schemas/ReactionCounts
      '401':
        description: Unauthorized
      '404':
        description: Not found / not reacted
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/posts/{postId}/reactions/users:
  get:
    tags:
    - Reactions
    summary: Get users who reacted with an emoji
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/PostId
    - name: emoji
      in: query
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Emoji
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    - name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/reactions.yml#/components/schemas/ReactionUsersPage
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
