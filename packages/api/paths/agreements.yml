/agreements/{type}/{version}:
  get:
    tags:
    - Server
    summary: Get agreement content by version
    description: 'Public endpoint to retrieve agreement document content for a specific version.

      No authentication required.

      '
    parameters:
    - name: type
      in: path
      required: true
      schema:
        $ref: ../schemas/enums.yml#/components/schemas/AgreementType
    - name: version
      in: path
      required: true
      schema:
        type: integer
    - name: language
      in: query
      schema:
        $ref: ../schemas/enums.yml#/components/schemas/AgreementLanguage
      description: Language preference (defaults to 'en')
    responses:
      '200':
        description: Agreement content
        content:
          application/json:
            schema:
              $ref: ../schemas/agreements.yml#/components/schemas/PublicAgreementContent
      '404':
        description: Agreement not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/agreements/{type}/latest:
  get:
    tags:
    - Server
    summary: Get latest agreement content
    description: 'Public endpoint to retrieve the latest published agreement document content.

      No authentication required.

      '
    parameters:
    - name: type
      in: path
      required: true
      schema:
        $ref: ../schemas/enums.yml#/components/schemas/AgreementType
    - name: language
      in: query
      schema:
        $ref: ../schemas/enums.yml#/components/schemas/AgreementLanguage
      description: Language preference (defaults to 'en')
    responses:
      '200':
        description: Agreement content
        content:
          application/json:
            schema:
              $ref: ../schemas/agreements.yml#/components/schemas/PublicAgreementContent
      '404':
        description: Agreement not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/agreements/current:
  get:
    tags:
    - Server
    summary: Get current agreement versions
    description: 'Public endpoint to retrieve current Terms of Service and Privacy Policy versions.

      No authentication required.

      '
    operationId: getAgreementVersions
    responses:
      '200':
        description: Current agreement versions
        content:
          application/json:
            schema:
              $ref: ../schemas/agreements.yml#/components/schemas/AgreementVersions
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
