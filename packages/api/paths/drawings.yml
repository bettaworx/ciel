/drawings:
  post:
    tags:
    - Drawings
    summary: Upload an immutable drawing draft
    description: Uploads a versioned replay JSON document. The server generates its 1200x800 static PNG preview from the validated strokes.
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: string
                format: binary
                description: Drawing replay document as application/json.
    responses:
      '201':
        description: Drawing draft created
        content:
          application/json:
            schema:
              $ref: ../schemas/drawing.yml#/components/schemas/Drawing
      '400':
        description: Invalid drawing
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '413':
        description: Drawing data, rendering work, or generated preview exceeds its limit
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error

/drawings/{drawingId}/replay:
  get:
    tags:
    - Drawings
    summary: Download a drawing replay document
    operationId: getDrawingReplay
    parameters:
    - name: drawingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Drawing replay document
        content:
          application/vnd.ciel.drawing+json:
            schema:
              type: string
              format: binary
      '401':
        description: Authentication is required for an unpublished drawing owned by the caller
      '403':
        description: Drawing belongs to another user and is not published
      '404':
        description: Drawing not found

