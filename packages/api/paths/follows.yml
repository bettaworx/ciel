/users/{username}/follow:
  post:
    tags:
    - Follows
    summary: Follow a user
    description: Following is instant. Following someone already followed succeeds without changing anything.
    security:
    - bearerAuth: []
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    responses:
      '200':
        description: OK. Returns the followed user with refreshed follow state.
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/User
      '400':
        description: Invalid request (e.g. following yourself)
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Follows
    summary: Unfollow a user
    description: Unfollowing someone not followed succeeds without changing anything.
    security:
    - bearerAuth: []
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    responses:
      '200':
        description: OK. Returns the unfollowed user with refreshed follow state.
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/User
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/users/{username}/followers:
  get:
    tags:
    - Follows
    summary: List users following this user
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    - name: cursor
      in: query
      required: false
      description: Cursor returned by previous call.
      schema:
        type: string
        nullable: true
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/UsersPage
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
