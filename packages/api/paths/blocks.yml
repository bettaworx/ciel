/users/{username}/mute:
  post:
    tags:
    - Blocks
    summary: Mute a user
    description: >-
      Hides the user from the caller's timelines, user search, follow lists and
      reaction lists, and suppresses their notifications. Their posts still load
      wherever the caller navigated on purpose, behind a reveal. The muted user
      is not told and loses no ability. Muting someone already muted succeeds
      without changing anything.
    security:
    - bearerAuth: []
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    responses:
      '200':
        description: OK. Returns the muted user with refreshed relationship state.
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/User
      '400':
        description: Invalid request (e.g. muting yourself)
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Blocks
    summary: Unmute a user
    description: Unmuting someone not muted succeeds without changing anything.
    security:
    - bearerAuth: []
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    responses:
      '200':
        description: OK. Returns the unmuted user with refreshed relationship state.
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/User
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/users/{username}/block:
  post:
    tags:
    - Blocks
    summary: Block a user
    description: >-
      Everything muting does, plus: the blocked user can no longer see the
      caller's posts, follow graph, reactions or media, and cannot follow, reply
      to, boost, quote or react to them. Any follow between the two is removed in
      both directions, pending requests included, and is not restored by
      unblocking. Blocking someone already blocked succeeds without changing
      anything.
    security:
    - bearerAuth: []
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    responses:
      '200':
        description: OK. Returns the blocked user with refreshed relationship state.
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/User
      '400':
        description: Invalid request (e.g. blocking yourself)
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Blocks
    summary: Unblock a user
    description: >-
      Restores the blocked user's access. Follows severed by the block are not
      restored. Unblocking someone not blocked succeeds without changing anything.
    security:
    - bearerAuth: []
    parameters:
    - name: username
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/Username
    responses:
      '200':
        description: OK. Returns the unblocked user with refreshed relationship state.
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/User
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/me/mutes:
  get:
    tags:
    - Blocks
    summary: List the accounts the caller has muted
    description: Newest first.
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    - name: cursor
      in: query
      required: false
      description: Cursor returned by previous call.
      schema:
        type: string
        nullable: true
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/UsersPage
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
/me/blocks:
  get:
    tags:
    - Blocks
    summary: List the accounts the caller has blocked
    description: >-
      Newest first. A block hides the account from search and from every list, so
      this is the only way back to it.
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    - name: cursor
      in: query
      required: false
      description: Cursor returned by previous call.
      schema:
        type: string
        nullable: true
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/user.yml#/components/schemas/UsersPage
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
