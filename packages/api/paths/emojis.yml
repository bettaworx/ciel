/emojis:
  get:
    tags:
    - Emojis
    summary: List custom emojis
    description: Returns the list of custom emojis available on this server.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    responses:
      '200':
        description: List of custom emojis
        content:
          application/json:
            schema:
              $ref: ../schemas/emoji.yml#/components/schemas/EmojiListResponse

/emojis/{shortcode}:
  get:
    tags:
    - Emojis
    summary: Get a custom emoji by shortcode
    parameters:
    - name: shortcode
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/EmojiShortcode
    responses:
      '200':
        description: Emoji details
        content:
          application/json:
            schema:
              $ref: ../schemas/emoji.yml#/components/schemas/PublicEmoji
      '404':
        description: Emoji not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
