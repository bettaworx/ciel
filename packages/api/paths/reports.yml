/reports:
  post:
    tags:
    - Reports
    summary: Create a report
    description: Submit a report for a user, post, or media item
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/reports.yml#/components/schemas/CreateReportRequest
    responses:
      '201':
        description: Report created
        content:
          application/json:
            schema:
              $ref: ../schemas/reports.yml#/components/schemas/Report
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '404':
        description: Target not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
