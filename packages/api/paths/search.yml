/search/posts:
  get:
    tags:
    - Search
    summary: Search posts
    description: 'Full-text search over public posts, newest first.


      The `q` parameter accepts an inline mini-syntax:

      - `from:alice` — only posts by this user (a leading `@` is allowed)

      - `#tag` or `tag:name` — only posts carrying this exact hashtag

      - `since:2026-01-01` — created on or after this date (UTC)

      - `until:2026-01-31` — created on or before this date (UTC, inclusive)

      - `"exact phrase"` — match the phrase exactly

      - `OR` — match any term instead of all of them (must be uppercase)


      A hashtag filter matches posts that actually carry the hashtag, not
      posts merely containing the word, and is case-insensitive.


      Dates also accept a full RFC 3339 timestamp. Anything else is treated as
      free text. Without `OR`, every term must match.


      Results are hydrated from the database, so posts that were deleted or
      hidden after they were indexed never appear.

      '
    security:
    - bearerAuth: []
    parameters:
    - name: q
      in: query
      required: true
      description: Search query, including any of the filters described above.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    - name: offset
      in: query
      required: false
      description: Number of results to skip.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/search.yml#/components/schemas/PostSearchPage
      '400':
        description: Invalid query syntax
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '503':
        description: Search is not configured on this server
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
/search/users:
  get:
    tags:
    - Search
    summary: Search users
    description: 'Full-text search over usernames, display names and bios, most
      relevant first.


      The `q` parameter accepts the same mini-syntax as post search, except that
      `from:` is ignored because the results are users. `since:` and `until:`
      filter on when the account was created. `#tag` matches users whose bio
      carries that exact hashtag.

      '
    security:
    - bearerAuth: []
    parameters:
    - name: q
      in: query
      required: true
      description: Search query, including any of the filters described above.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    - name: offset
      in: query
      required: false
      description: Number of results to skip.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/search.yml#/components/schemas/UserSearchPage
      '400':
        description: Invalid query syntax
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '503':
        description: Search is not configured on this server
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
