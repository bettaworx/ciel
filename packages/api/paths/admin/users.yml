/admin/users:
  get:
    tags:
    - Admin
    summary: Search users
    description: Search and list users with filters, pagination, and stats
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: search
      in: query
      schema:
        type: string
      description: Search by username or display name
    - name: sort
      in: query
      schema:
        type: string
        enum:
        - created_asc
        - created_desc
        - username_asc
        - username_desc
        default: created_desc
      description: Sort order
    responses:
      '200':
        description: List of users with stats
        content:
          application/json:
            schema:
              $ref: ../../schemas/admin.yml#/components/schemas/AdminUserPage
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_access permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
/admin/users/{userId}/stats:
  get:
    tags:
    - Admin
    summary: Get user statistics
    description: Retrieve detailed statistics for a specific user
    security:
    - bearerAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: User statistics
        content:
          application/json:
            schema:
              $ref: ../../schemas/admin.yml#/components/schemas/UserStats
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_access permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
