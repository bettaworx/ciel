/admin/users/{userId}/privacy:
  patch:
    tags:
    - Admin
    summary: Set a user's account privacy
    description: >-
      Force an account private, or release it back to public, from moderation.
      Behaves exactly as the user's own switch does: nothing is deleted, so
      turning it off restores their history, and turning it off also accepts any
      follow requests still pending. Recorded in the moderation log.
    security:
    - bearerAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        $ref: ../../schemas/common.yml#/components/schemas/UserId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/user.yml#/components/schemas/UpdatePrivacyRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../schemas/user.yml#/components/schemas/User
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
        content:
