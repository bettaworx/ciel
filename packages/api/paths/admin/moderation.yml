      in: query
      schema:
        type: string
        format: uuid
      description: Filter by admin user ID
    - name: action
      in: query
      schema:
        $ref: ../../schemas/enums.yml#/components/schemas/ModerationAction
      description: Filter by action type
    - name: targetType
      in: query
      schema:
        $ref: ../../schemas/enums.yml#/components/schemas/ModerationTargetType
      description: Filter by target type
    - name: targetId
      in: query
      schema:
        type: string
