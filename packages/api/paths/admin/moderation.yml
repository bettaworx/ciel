/admin/users/{userId}/mutes:
  get:
    tags:
    - Admin
    summary: List user mutes
    description: List all active mutes for a user
    security:
    - bearerAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: List of user mutes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../../schemas/admin.yml#/components/schemas/UserMute
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_users_mute permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  post:
    tags:
    - Admin
    summary: Create user mute
    description: Create a new mute for a user
    security:
    - bearerAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/admin.yml#/components/schemas/CreateUserMuteRequest
    responses:
      '201':
        description: Mute created
        content:
          application/json:
            schema:
              $ref: ../../schemas/admin.yml#/components/schemas/UserMute
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_users_mute permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Admin
    summary: Remove all user mutes
    description: Remove all active mutes for a user
    security:
    - bearerAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '204':
        description: Mutes removed
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_users_mute permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
/admin/users/{userId}/mutes/{muteType}:
  delete:
    tags:
    - Admin
    summary: Remove specific user mute type
    description: Remove a specific mute type for a user
    security:
    - bearerAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: muteType
      in: path
      required: true
      schema:
        $ref: ../../schemas/enums.yml#/components/schemas/MuteType
    responses:
