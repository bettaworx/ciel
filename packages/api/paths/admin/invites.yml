/admin/invites:
  get:
    tags:
    - Admin
    summary: List invite codes
    description: Get paginated list of invite codes with usage information
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../schemas/invites.yml#/components/schemas/InviteCodesListResponse
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  post:
    tags:
    - Admin
    summary: Create invite code
    description: Create a new invite code with optional usage limits and expiration
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/invites.yml#/components/schemas/CreateInviteCodeRequest
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../../schemas/invites.yml#/components/schemas/InviteCode
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
/admin/invites/{inviteId}:
  get:
    tags:
    - Admin
    summary: Get invite code details
    description: Get detailed information about a specific invite code
    security:
    - bearerAuth: []
    parameters:
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../../schemas/invites.yml#/components/schemas/InviteCode
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  patch:
    tags:
    - Admin
    summary: Update invite code
    description: Update invite code properties (code, maxUses, expiresAt, note)
    security:
    - bearerAuth: []
    parameters:
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/invites.yml#/components/schemas/UpdateInviteCodeRequest
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema:
              $ref: ../../schemas/invites.yml#/components/schemas/InviteCode
      '400':
        description: Bad request (validation error or duplicate code)
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '409':
        description: Conflict - invite code already exists
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Admin
    summary: Delete invite code
    description: Permanently delete an invite code
    security:
    - bearerAuth: []
    parameters:
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '204':
        description: Deleted
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
      '404':
        description: Not found
/admin/invites/{inviteId}/disable:
  patch:
    tags:
    - Admin
    summary: Disable invite code
    description: Soft-delete an invite code by marking it as disabled
    security:
    - bearerAuth: []
    parameters:
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '204':
        description: Disabled
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
      '404':
        description: Not found
/admin/invites/{inviteId}/uses:
  get:
    tags:
    - Admin
    summary: Get invite code usage history
    description: Get list of users who used this invite code
    security:
    - bearerAuth: []
    parameters:
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../../schemas/invites.yml#/components/schemas/InviteCodeUse
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - not admin
      '404':
        description: Not found
