/admin/posts:
  get:
    tags:
    - Admin
    summary: List posts (admin view)
    description: List all posts with filtering and admin-only fields
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: userId
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by user ID
    - name: visibility
      in: query
      schema:
        $ref: ../../schemas/enums.yml#/components/schemas/PostVisibility
      description: Filter by visibility status
    responses:
      '200':
        description: List of posts
        content:
          application/json:
            schema:
              $ref: ../../schemas/admin.yml#/components/schemas/AdminPostPage
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_posts_read permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
/admin/posts/{postId}:
  delete:
    tags:
    - Admin
    summary: Delete post (admin)
    description: Permanently delete a post with optional reason
    security:
    - bearerAuth: []
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../../schemas/admin.yml#/components/schemas/DeletePostRequest
    responses:
      '204':
        description: Post deleted
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_posts_delete permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: Post not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
/admin/posts/{postId}/visibility:
  patch:
    tags:
    - Admin
    summary: Update post visibility
    description: Change post visibility (public/hidden/deleted)
    security:
    - bearerAuth: []
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/admin.yml#/components/schemas/UpdatePostVisibilityRequest
    responses:
      '200':
        description: Visibility updated
        content:
          application/json:
            schema:
              $ref: ../../schemas/admin.yml#/components/schemas/AdminPost
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin_posts_visibility permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: Post not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
