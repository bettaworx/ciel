/admin/emojis:
  get:
    tags:
    - Admin
    summary: List custom emojis (admin view)
    description: Returns all custom emojis including admin-only fields (id, createdAt, updatedAt, width, height).
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    responses:
      '200':
        description: List of custom emojis with admin fields
        content:
          application/json:
            schema:
              $ref: ../../schemas/emoji.yml#/components/schemas/AdminEmojiListResponse
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin:emojis:manage permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  post:
    tags:
    - Admin
    summary: Create a custom emoji
    description: Upload an image and create a new custom emoji. Image is resized to configured height (default 128px) and converted to WebP.
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - shortcode
            - image
            properties:
              shortcode:
                $ref: ../../schemas/common.yml#/components/schemas/EmojiShortcode
              name:
                type: string
                description: Optional display name.
              category:
                type: string
                description: Optional category for grouping emojis.
              license:
                type: string
                description: Optional license information for the emoji image.
              image:
                type: string
                format: binary
                description: Emoji image file (png, jpg, jpeg, webp, gif). Max 15 MiB, max 2048x2048.
    responses:
      '201':
        description: Emoji created
        content:
          application/json:
            schema:
              $ref: ../../schemas/emoji.yml#/components/schemas/AdminEmoji
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin:emojis:manage permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '409':
        description: Shortcode already in use
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '413':
        description: File too large
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '415':
        description: Unsupported media type
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error

/admin/emojis/{emojiId}:
  put:
    tags:
    - Admin
    summary: Update a custom emoji
    description: Update shortcode, name, category, license, and/or image of an existing emoji.
    security:
    - bearerAuth: []
    parameters:
    - name: emojiId
      in: path
      required: true
      schema:
        $ref: ../../schemas/common.yml#/components/schemas/EmojiId
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              shortcode:
                $ref: ../../schemas/common.yml#/components/schemas/EmojiShortcode
              name:
                type: string
                nullable: true
                description: Display name. Send empty string to clear.
              setName:
                type: boolean
                description: Must be true to update the name field (including clearing it).
              category:
                type: string
                nullable: true
                description: Category. Send empty string to clear.
              setCategory:
                type: boolean
                description: Must be true to update the category field.
              license:
                type: string
                nullable: true
                description: License. Send empty string to clear.
              setLicense:
                type: boolean
                description: Must be true to update the license field.
              image:
                type: string
                format: binary
                description: New emoji image (optional). Replaces the existing image.
    responses:
      '200':
        description: Emoji updated
        content:
          application/json:
            schema:
              $ref: ../../schemas/emoji.yml#/components/schemas/AdminEmoji
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin:emojis:manage permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: Emoji not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '409':
        description: Shortcode already in use
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Admin
    summary: Delete a custom emoji
    description: Permanently deletes the emoji and its image file.
    security:
    - bearerAuth: []
    parameters:
    - name: emojiId
      in: path
      required: true
      schema:
        $ref: ../../schemas/common.yml#/components/schemas/EmojiId
    responses:
      '204':
        description: Emoji deleted
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - requires admin:emojis:manage permission
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
      '404':
        description: Emoji not found
        content:
          application/json:
            schema:
              $ref: ../../schemas/common.yml#/components/schemas/Error
