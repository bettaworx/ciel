/posts:
  post:
    tags:
    - Posts
    summary: Create a post
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/post.yml#/components/schemas/CreatePostRequest
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../schemas/post.yml#/components/schemas/Post
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '401':
        description: Unauthorized
/posts/{postId}:
  get:
    tags:
    - Posts
    summary: Get a post
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/PostId
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../schemas/post.yml#/components/schemas/Post
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
  delete:
    tags:
    - Posts
    summary: Delete a post
    security:
    - bearerAuth: []
    parameters:
    - name: postId
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yml#/components/schemas/PostId
    responses:
      '204':
        description: Deleted
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yml#/components/schemas/Error
