components:
  schemas:
    RegisterRequest:
      type: object
      required:
      - username
      - password
      - termsVersion
      - privacyVersion
      properties:
        username:
          $ref: ./common.yml#/components/schemas/Username
        password:
          type: string
          minLength: 9
          maxLength: 256
        inviteCode:
          type: string
          description: Required when server is in invite-only mode
        termsVersion:
          type: integer
          minimum: 1
          description: Version of Terms of Service being accepted
        privacyVersion:
          type: integer
          minimum: 1
          description: Version of Privacy Policy being accepted
    LoginStartRequest:
      type: object
      required:
      - username
      - clientNonce
      properties:
        username:
          $ref: ./common.yml#/components/schemas/Username
        clientNonce:
          type: string
          minLength: 16
          maxLength: 256
          description: Random nonce generated by the client.
    LoginStartResponse:
      type: object
      required:
      - loginSessionId
      - salt
      - iterations
      - serverNonce
      - expiresInSeconds
      properties:
        loginSessionId:
          type: string
        salt:
          type: string
          description: Base64-encoded salt.
        iterations:
          type: integer
          minimum: 10000
          description: PBKDF2 iteration count.
        serverNonce:
          type: string
          description: Server-provided nonce to append to clientNonce.
        expiresInSeconds:
          type: integer
          minimum: 1
    LoginFinishRequest:
      type: object
      required:
      - loginSessionId
      - clientFinalNonce
      - clientProof
      properties:
        loginSessionId:
          type: string
        clientFinalNonce:
          type: string
          description: Typically clientNonce + serverNonce.
        clientProof:
          type: string
          description: Base64-encoded proof computed by the client.
    LoginFinishResponse:
      oneOf:
      - $ref: '#/components/schemas/LoginAuthenticated'
      - $ref: '#/components/schemas/LoginMfaRequired'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/LoginAuthenticated'
          mfa_required: '#/components/schemas/LoginMfaRequired'
    LoginAuthenticated:
      type: object
      required:
      - status
      - accessToken
      - tokenType
      - expiresInSeconds
      - user
      properties:
        status:
          type: string
          enum:
          - authenticated
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresInSeconds:
          type: integer
          minimum: 1
        user:
          $ref: ./user.yml#/components/schemas/User
    LoginMfaRequired:
      type: object
      required:
      - status
      - mfaToken
      - expiresInSeconds
      - methods
      properties:
        status:
          type: string
          enum:
          - mfa_required
        mfaToken:
          type: string
          description: Short-lived token binding the SCRAM-verified login session to MFA verification.
        expiresInSeconds:
          type: integer
          minimum: 1
        methods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MfaMethod'
    MfaMethod:
      type: string
      enum:
      - totp
      - webauthn
      - backup_code
    RefreshResponse:
      type: object
      required:
      - expiresInSeconds
      properties:
        expiresInSeconds:
          type: integer
          minimum: 1
          description: Lifetime of the newly issued access token in seconds.
    SessionTokenRequest:
      type: object
      required:
      - publicKey
      properties:
        publicKey:
          type: string
          description: Base64-encoded SPKI of the browser's non-extractable ECDSA P-256 device key.
    SessionTokenResponse:
      type: object
      required:
      - token
      - expiresInSeconds
      properties:
        token:
          type: string
          description: Opaque account token, useless without a signature from the bound device key.
        expiresInSeconds:
          type: integer
          minimum: 1
    SessionExchangeRequest:
      type: object
      required:
      - token
      - timestamp
      - nonce
      - signature
      properties:
        token:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Unix seconds the signature was made at. Accepted within a 60 second window.
        nonce:
          type: string
          minLength: 16
          maxLength: 128
          description: Single-use random value; a repeat within the window is rejected.
        signature:
          type: string
          description: Base64 ECDSA P-256 / SHA-256 signature over "<token>.<timestamp>.<nonce>".
        activate:
          type: boolean
          description: >-
            When true, the session cookies are re-issued for this account and the
            account token is rotated. Omit for read-only use.
    SessionExchangeResponse:
      type: object
      required:
      - user
      - accessToken
      - expiresInSeconds
      properties:
        user:
          $ref: ./user.yml#/components/schemas/User
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
        token:
          type: string
          description: Replacement account token. Present only when activate was true.
    StepupStartRequest:
      type: object
      required:
      - clientNonce
      properties:
        clientNonce:
          type: string
          minLength: 16
          maxLength: 256
          description: Random nonce generated by the client.
    StepupStartResponse:
      type: object
      required:
      - stepupSessionId
      - salt
      - iterations
      - serverNonce
      - expiresInSeconds
      properties:
        stepupSessionId:
          type: string
        salt:
          type: string
          description: Base64-encoded salt.
        iterations:
          type: integer
          minimum: 10000
          description: PBKDF2 iteration count.
        serverNonce:
          type: string
          description: Server-provided nonce to append to clientNonce.
        expiresInSeconds:
          type: integer
          minimum: 1
    StepupFinishRequest:
      type: object
      required:
      - stepupSessionId
      - clientFinalNonce
      - clientProof
      properties:
        stepupSessionId:
          type: string
        clientFinalNonce:
          type: string
          description: Typically clientNonce + serverNonce.
        clientProof:
          type: string
          description: Base64-encoded proof computed by the client.
    StepupFinishResponse:
      oneOf:
      - $ref: '#/components/schemas/StepupAuthenticated'
      - $ref: '#/components/schemas/StepupMfaRequired'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/StepupAuthenticated'
          mfa_required: '#/components/schemas/StepupMfaRequired'
    StepupAuthenticated:
      type: object
      required:
      - status
      - stepupToken
      - tokenType
      - expiresInSeconds
      properties:
        status:
          type: string
          enum:
          - authenticated
        stepupToken:
          type: string
        tokenType:
          type: string
          enum:
          - Stepup
        expiresInSeconds:
          type: integer
          minimum: 1
    StepupMfaRequired:
      type: object
      required:
      - status
      - mfaToken
      - expiresInSeconds
      - methods
      properties:
        status:
          type: string
          enum:
          - mfa_required
        mfaToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
        methods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MfaMethod'
    PasswordChangeRequest:
      type: object
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
    MfaStatus:
      type: object
      required:
      - totpEnabled
      - webauthnCredentials
      - backupCodesRemaining
      properties:
        totpEnabled:
          type: boolean
        totpEnabledAt:
          type: string
          format: date-time
          nullable: true
        webauthnCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnCredential'
        backupCodesRemaining:
          type: integer
          minimum: 0
    TotpSetupResponse:
      type: object
      required:
      - secret
      - otpauthUrl
      - expiresInSeconds
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP shared secret (show once for manual entry).
        otpauthUrl:
          type: string
          format: uri
          description: otpauth:// URI for QR code provisioning.
        expiresInSeconds:
          type: integer
          minimum: 1
    TotpConfirmRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
          description: Current 6-digit TOTP code from the authenticator app.
    TotpConfirmResponse:
      type: object
      required:
      - backupCodes
      properties:
        backupCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: One-time backup codes shown only once. Store them securely.
    BackupCodesRegenerateResponse:
      type: object
      required:
      - backupCodes
      properties:
        backupCodes:
          type: array
          minItems: 1
          items:
            type: string
    MfaCodeVerifyRequest:
      type: object
      required:
      - mfaToken
      - code
      properties:
        mfaToken:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 32
          description: TOTP code or backup code.
        method:
          $ref: '#/components/schemas/MfaMethod'
          description: Optional hint. When omitted the server tries totp then backup_code.
    MfaWebAuthnOptionsRequest:
      type: object
      required:
      - mfaToken
      properties:
        mfaToken:
          type: string
    MfaWebAuthnVerifyRequest:
      type: object
      required:
      - mfaToken
      - credential
      properties:
        mfaToken:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredential JSON from navigator.credentials.get().
    WebAuthnCredential:
      type: object
      required:
      - id
      - name
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        transports:
          type: array
          items:
            type: string
    WebAuthnRegisterOptionsResponse:
      type: object
      required:
      - options
      - sessionId
      properties:
        sessionId:
          type: string
          description: Opaque session id to send back with the attestation response.
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialCreationOptions JSON for navigator.credentials.create().
    WebAuthnRegisterVerifyRequest:
      type: object
      required:
      - sessionId
      - credential
      - name
      properties:
        sessionId:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredential JSON from navigator.credentials.create().
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Human-readable label for this authenticator.
    WebAuthnRegisterVerifyResponse:
      type: object
      required:
      - credential
      - backupCodes
      properties:
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
        backupCodes:
          type: array
          items:
            type: string
          description: >-
            Present only when this registration is the user's first 2FA factor
            and backup codes were generated. Empty array otherwise.
    WebAuthnCredentialUpdateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    WebAuthnAssertionOptionsResponse:
      type: object
      required:
      - options
      - sessionId
      properties:
        sessionId:
          type: string
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialRequestOptions JSON for navigator.credentials.get().
