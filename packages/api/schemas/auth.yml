components:
  schemas:
    RegisterRequest:
      type: object
      required:
      - username
      - password
      - termsVersion
      - privacyVersion
      properties:
        username:
          $ref: ./common.yml#/components/schemas/Username
        password:
          type: string
          minLength: 9
          maxLength: 256
        inviteCode:
          type: string
          description: Required when server is in invite-only mode
        termsVersion:
          type: integer
          minimum: 1
          description: Version of Terms of Service being accepted
        privacyVersion:
          type: integer
          minimum: 1
          description: Version of Privacy Policy being accepted
    LoginStartRequest:
      type: object
      required:
      - username
      - clientNonce
      properties:
        username:
          $ref: ./common.yml#/components/schemas/Username
        clientNonce:
          type: string
          minLength: 16
          maxLength: 256
          description: Random nonce generated by the client.
    LoginStartResponse:
      type: object
      required:
      - loginSessionId
      - salt
      - iterations
      - serverNonce
      - expiresInSeconds
      properties:
        loginSessionId:
          type: string
        salt:
          type: string
          description: Base64-encoded salt.
        iterations:
          type: integer
          minimum: 10000
          description: PBKDF2 iteration count.
        serverNonce:
          type: string
          description: Server-provided nonce to append to clientNonce.
        expiresInSeconds:
          type: integer
          minimum: 1
    LoginFinishRequest:
      type: object
      required:
      - loginSessionId
      - clientFinalNonce
      - clientProof
      properties:
        loginSessionId:
          type: string
        clientFinalNonce:
          type: string
          description: Typically clientNonce + serverNonce.
        clientProof:
          type: string
          description: Base64-encoded proof computed by the client.
    LoginFinishResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresInSeconds
      - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresInSeconds:
          type: integer
          minimum: 1
        user:
          $ref: ./user.yml#/components/schemas/User
    RefreshResponse:
      type: object
      required:
      - expiresInSeconds
      properties:
        expiresInSeconds:
          type: integer
          minimum: 1
          description: Lifetime of the newly issued access token in seconds.
    StepupStartRequest:
      type: object
      required:
      - clientNonce
      properties:
        clientNonce:
          type: string
          minLength: 16
          maxLength: 256
          description: Random nonce generated by the client.
    StepupStartResponse:
      type: object
      required:
      - stepupSessionId
      - salt
      - iterations
      - serverNonce
      - expiresInSeconds
      properties:
        stepupSessionId:
          type: string
        salt:
          type: string
          description: Base64-encoded salt.
        iterations:
          type: integer
          minimum: 10000
          description: PBKDF2 iteration count.
        serverNonce:
          type: string
          description: Server-provided nonce to append to clientNonce.
        expiresInSeconds:
          type: integer
          minimum: 1
    StepupFinishRequest:
      type: object
      required:
      - stepupSessionId
      - clientFinalNonce
      - clientProof
      properties:
        stepupSessionId:
          type: string
        clientFinalNonce:
          type: string
          description: Typically clientNonce + serverNonce.
        clientProof:
          type: string
          description: Base64-encoded proof computed by the client.
    StepupFinishResponse:
      type: object
      required:
      - stepupToken
      - tokenType
      - expiresInSeconds
      properties:
        stepupToken:
          type: string
        tokenType:
          type: string
          enum:
          - Stepup
        expiresInSeconds:
          type: integer
          minimum: 1
    PasswordChangeRequest:
      type: object
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
