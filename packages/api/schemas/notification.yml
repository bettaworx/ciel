components:
  schemas:
    Notification:
      type: object
      required:
      - id
      - type
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: ./enums.yml#/components/schemas/NotificationType
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        actor:
          allOf:
          - $ref: ./user.yml#/components/schemas/MentionUser
          nullable: true
          description: User who triggered the notification. Null for system notifications.
        post:
          allOf:
          - $ref: ./post.yml#/components/schemas/Post
          nullable: true
          description: Post the notification is about. Null when the notification is not tied to a post.
        emoji:
          allOf:
          - $ref: ./common.yml#/components/schemas/Emoji
          nullable: true
          description: Emoji used, for reaction notifications.
        count:
          type: integer
          minimum: 1
          default: 1
          description: >-
            How many notifications this row represents. Reactions sharing a post
            and emoji, and plain boosts of the same post, collapse into one row.
            Everything else is always 1.
        actorCount:
          type: integer
          minimum: 1
          default: 1
          description: >-
            How many distinct people this row represents. Differs from `count`
            for reactions, where one person can react to a post several times.
        actors:
          type: array
          description: >-
            Actors for the avatars on a grouped row, newest first. The same
            person appears once per reaction they left. `actor` remains the most
            recent one.
          items:
            $ref: '#/components/schemas/NotificationActor'
        notificationIds:
          type: array
          description: The notifications this row covers, for marking them read.
          items:
            type: string
            format: uuid
    NotificationActor:
      type: object
      description: One actor on a notification row, with what they reacted with.
      required:
      - user
      properties:
        user:
          $ref: ./user.yml#/components/schemas/MentionUser
        emoji:
          allOf:
          - $ref: ./common.yml#/components/schemas/Emoji
          nullable: true
          description: The emoji this actor reacted with. Null for other kinds.
    NotificationsPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: string
          nullable: true
    UnreadCount:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          minimum: 0
    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          nullable: true
          description: Notification IDs to mark as read. Omit or null to mark every unread notification as read.
          items:
            type: string
            format: uuid
