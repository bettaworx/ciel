components:
  schemas:
    User:
      type: object
      required:
      - id
      - username
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: ./common.yml#/components/schemas/Username
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
          maxLength: 50
          nullable: true
        bio:
          type: string
          maxLength: 200
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bannerUrl:
          type: string
          format: uri
          nullable: true
        bannerBlurhash:
          type: string
          nullable: true
          description: BlurHash placeholder for the banner image. Null when no banner is set or generation failed.
        isAdmin:
          type: boolean
          description: Whether user has admin.all permission
        termsVersion:
          type: integer
          description: Version of Terms of Service accepted by user (0 = not accepted)
        privacyVersion:
          type: integer
          description: Version of Privacy Policy accepted by user (0 = not accepted)
        termsAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When user accepted Terms of Service
        privacyAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When user accepted Privacy Policy
        followersCount:
          type: integer
          description: Number of users following this user. Omitted in list responses.
        followingCount:
          type: integer
          description: Number of users this user follows. Omitted in list responses.
        isFollowing:
          type: boolean
          description: Whether the caller follows this user. Omitted when unauthenticated.
        isFollowedBy:
          type: boolean
          description: Whether this user follows the caller. Omitted when unauthenticated.
        isPrivate:
          type: boolean
          description: >-
            Whether this account is private. A private account's posts and
            interactions are visible only to accepted followers, and following it
            creates a follow request instead of a follow. Clients show a lock
            beside the display name wherever the name stands on its own, but not
            where it is substituted into a sentence such as notification text.
        followRequestSent:
          type: boolean
          description: >-
            Whether the caller has a follow request awaiting this user's approval.
            Omitted when unauthenticated.
        isMuted:
          type: boolean
          description: >-
            Whether the caller has muted this user. Muted accounts are dropped
            from both timelines, from user search and from follow and reaction
            lists, but their posts still arrive wherever the caller navigated on
            purpose — a profile, a quoted post, a reply's parent — and the client
            hides those behind a reveal button. Clients also draw a muted-speaker
            icon beside the display name, in the same places as the private lock.
            Omitted when unauthenticated.
        isBlocking:
          type: boolean
          description: >-
            Whether the caller has blocked this user. Everything isMuted does
            applies, drawn with a prohibition icon instead. Omitted when
            unauthenticated.
        isBlockedBy:
          type: boolean
          description: >-
            Whether this user has blocked the caller. The caller sees none of
            their posts, follow graph, reactions or media, and cannot follow,
            reply to, boost, quote or react to them; the profile itself stays
            reachable so the client can say so. Omitted when unauthenticated.
    UsersPage:
      type: object
      description: Paginated list of users, newest relationship first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page. Null when there are no more results.
        totalCount:
          type: integer
          description: Total number of matching users. Only set by /followers_you_follow, and only on the first page.
    MentionUser:
      type: object
      description: Lightweight user representation for mentions in post content.
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: ./common.yml#/components/schemas/Username
        displayName:
          type: string
          maxLength: 50
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 50
          nullable: true
        bio:
          type: string
          maxLength: 200
          nullable: true
    UpdatePrivacyRequest:
      type: object
      required:
      - isPrivate
      properties:
        isPrivate:
          type: boolean
    FollowRequestsPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          nullable: true
    UpdateUsernameRequest:
      type: object
      required:
      - username
      properties:
        username:
          $ref: ./common.yml#/components/schemas/Username
