components:
  schemas:
    User:
      type: object
      required:
      - id
      - username
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: ./common.yml#/components/schemas/Username
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
          maxLength: 50
          nullable: true
        bio:
          type: string
          maxLength: 200
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bannerUrl:
          type: string
          format: uri
          nullable: true
        bannerBlurhash:
          type: string
          nullable: true
          description: BlurHash placeholder for the banner image. Null when no banner is set or generation failed.
        isAdmin:
          type: boolean
          description: Whether user has admin.all permission
        termsVersion:
          type: integer
          description: Version of Terms of Service accepted by user (0 = not accepted)
        privacyVersion:
          type: integer
          description: Version of Privacy Policy accepted by user (0 = not accepted)
        termsAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When user accepted Terms of Service
        privacyAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When user accepted Privacy Policy
        followersCount:
          type: integer
          description: Number of users following this user. Omitted in list responses.
        followingCount:
          type: integer
          description: Number of users this user follows. Omitted in list responses.
        isFollowing:
          type: boolean
          description: Whether the caller follows this user. Omitted when unauthenticated.
        isFollowedBy:
          type: boolean
          description: Whether this user follows the caller. Omitted when unauthenticated.
    UsersPage:
      type: object
      description: Paginated list of users, newest relationship first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page. Null when there are no more results.
        totalCount:
          type: integer
          description: Total number of matching users. Only set by /followers_you_follow, and only on the first page.
    MentionUser:
      type: object
      description: Lightweight user representation for mentions in post content.
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: ./common.yml#/components/schemas/Username
        displayName:
          type: string
          maxLength: 50
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 50
          nullable: true
        bio:
          type: string
          maxLength: 200
          nullable: true
    UpdateUsernameRequest:
      type: object
      required:
      - username
      properties:
        username:
          $ref: ./common.yml#/components/schemas/Username
