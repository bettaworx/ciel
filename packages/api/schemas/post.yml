components:
  schemas:
    Post:
      type: object
      required:
      - id
      - author
      - content
      - createdAt
      - media
      - reactions
      - mentions
      - replyCount
      - boostCount
      properties:
        id:
          $ref: ./common.yml#/components/schemas/PostId
        author:
          $ref: ./user.yml#/components/schemas/User
        content:
          type: string
          maxLength: 300
        media:
          type: array
          maxItems: 4
          items:
            $ref: ./media.yml#/components/schemas/Media
        reactions:
          type: array
          items:
            $ref: ./reactions.yml#/components/schemas/ReactionCount
        mentions:
          type: array
          description: Users mentioned in the post content via @username syntax.
          items:
            $ref: ./user.yml#/components/schemas/MentionUser
        replyCount:
          type: integer
          minimum: 0
          description: Number of non-deleted direct replies to this post.
        boostCount:
          type: integer
          minimum: 0
          description: Number of boosts and quotes referencing this post.
        parentId:
          allOf:
          - $ref: ./common.yml#/components/schemas/PostId
          nullable: true
          description: ID of the post this post replies to. Null for root posts or when the parent has been hard-deleted (e.g., parent author deleted their account).
        rootId:
          allOf:
          - $ref: ./common.yml#/components/schemas/PostId
          nullable: true
          description: ID of the root post of the thread. Null for root posts themselves.
        referenceId:
          allOf:
          - $ref: ./common.yml#/components/schemas/PostId
          nullable: true
          description: ID of the post being boosted or quoted. Null for original posts.
        reference:
          allOf:
          - $ref: '#/components/schemas/Post'
          nullable: true
          description: The referenced (boosted/quoted) post data (one level deep). Null when the referenced post has been deleted or for non-boost posts.
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    TimelinePage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        nextCursor:
          type: string
          nullable: true
    PostContext:
      type: object
      required:
      - post
      properties:
        post:
          $ref: '#/components/schemas/Post'
        parent:
          allOf:
          - $ref: '#/components/schemas/Post'
          nullable: true
          description: Direct parent post when it is still visible. Null for root posts or deleted parents.
        root:
          allOf:
          - $ref: '#/components/schemas/Post'
          nullable: true
          description: Root post of the thread when different from the post and still visible.
    ThreadChildren:
      type: object
      required:
      - parentId
      - childIds
      - hasMore
      properties:
        parentId:
          $ref: ./common.yml#/components/schemas/PostId
        childIds:
          type: array
          items:
            $ref: ./common.yml#/components/schemas/PostId
        nextCursor:
          type: string
          nullable: true
          description: Cursor for loading more direct children of parentId.
        hasMore:
          type: boolean
          description: True when parentId has more direct children after childIds.
    ThreadPage:
      type: object
      required:
      - root
      - anchor
      - nodes
      - children
      properties:
        root:
          $ref: '#/components/schemas/Post'
        anchor:
          $ref: '#/components/schemas/Post'
        nodes:
          type: array
          description: Flat list of posts returned for this thread slice. Includes root and anchor.
          items:
            $ref: '#/components/schemas/Post'
        children:
          type: array
          description: Direct child relationships for the returned slice, keyed by parentId.
          items:
            $ref: '#/components/schemas/ThreadChildren'
    UserPostsPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        nextCursor:
          type: string
          nullable: true
    CreatePostRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 300
        mediaIds:
          type: array
          description: Media IDs to attach to the post (in order).
          maxItems: 4
          items:
            $ref: ./common.yml#/components/schemas/MediaId
        parentId:
          allOf:
          - $ref: ./common.yml#/components/schemas/PostId
          description: When set, the new post becomes a reply to the referenced post. Returns 404 if the parent does not exist or has been deleted.
        referenceId:
          allOf:
          - $ref: ./common.yml#/components/schemas/PostId
          description: When set, the new post is a boost (no content) or quote (with content) of the referenced post. Returns 404 if the referenced post does not exist or has been deleted.
