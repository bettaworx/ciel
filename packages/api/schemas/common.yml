components:
  schemas:
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: ^[a-zA-Z0-9_]+$
    Emoji:
      type: string
      minLength: 1
      maxLength: 64
      description: "Unicode emoji string or custom emoji shortcode in :shortcode: format."
    EmojiId:
      type: string
      format: uuid
    EmojiShortcode:
      type: string
      minLength: 2
      maxLength: 50
      pattern: ^[a-zA-Z0-9_]+$
      description: Custom emoji shortcode (alphanumeric and underscore only, Mastodon-compatible).
    PostId:
      type: string
      format: uuid
    MediaId:
      type: string
      format: uuid
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    RoleId:
      type: string
      pattern: ^[a-z0-9_]+$
    UserId:
      type: string
      format: uuid
    PermissionId:
      type: string
      pattern: ^[a-z0-9_]+$
