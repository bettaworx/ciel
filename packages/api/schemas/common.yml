components:
  schemas:
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: ^[a-zA-Z0-9_]+$
    Emoji:
      type: string
      minLength: 1
      maxLength: 16
      description: Unicode emoji string.
    PostId:
      type: string
      format: uuid
    MediaId:
      type: string
      format: uuid
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    RoleId:
      type: string
      pattern: ^[a-z0-9_]+$
    UserId:
      type: string
      format: uuid
    PermissionId:
      type: string
      pattern: ^[a-z0-9_]+$
