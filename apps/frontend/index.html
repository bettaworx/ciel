<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactiveWidget pins what the software keyboard does to the viewport
      instead of leaving it to each browser's default. resizes-content shrinks
      the layout viewport itself, so on Chromium a bottom-anchored sheet lands
      above the keyboard with no JavaScript at all - and dvh follows. iOS
      ignores the hint, which is what KeyboardInset is for.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Ciel</title>

    <!-- Served by the backend so the install prompt carries the instance name. -->
    <link rel="manifest" href="/pwa/manifest.json" />

    <!-- Replaced at runtime by FaviconLink once server info arrives. -->
    <link rel="icon" href="/icon-default.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ciel" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
