root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ."
  bin = "tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
  exclude_dir = ["tmp", "data", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  kill_delay = "500ms"
  send_interrupt = false
  stop_on_error = false

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false
