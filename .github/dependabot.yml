version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "next-*"
          - "eslint-config-next"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "autoprefixer"
          - "postcss"
      others:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
