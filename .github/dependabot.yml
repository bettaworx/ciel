version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # These would land in the "others" group and fail its build every week.
    ignore:
      # TypeScript 7.0 ships the native compiler only, without the JS API that
      # openapi-typescript (gen:openapi) and Storybook's react-docgen-typescript
      # call. Drop this once openapi-typescript supports 7.
      - dependency-name: typescript
        versions: [">=7"]
      # The React Compiler goes through @vitejs/plugin-react, whose peer range is
      # >=0.152.0 <0.157.0. Drop this when plugin-react widens it.
      - dependency-name: oxc-transform-react
        versions: [">=0.157.0"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      fontsource:
        patterns:
          - "@fontsource/*"
          - "@fontsource-variable/*"

      radix-ui:
        patterns:
          - "@radix-ui/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "autoprefixer"
          - "postcss"
      others:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-openapi:
        patterns:
          - "github.com/getkin/kin-openapi"
          - "github.com/oapi-codegen/*"
          - "github.com/oasdiff/*"
      go-database:
        patterns:
          - "github.com/jackc/*"
          - "github.com/lib/pq"
          - "github.com/sqlc-dev/*"
      go-crypto-image:
        patterns:
          - "golang.org/x/crypto"
          - "golang.org/x/image"
      go-others:
        patterns:
          - "*"
