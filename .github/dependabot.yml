version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "next-*"
          - "eslint-config-next"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "autoprefixer"
          - "postcss"
      others:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/backend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-openapi:
        patterns:
          - "github.com/getkin/kin-openapi"
          - "github.com/oapi-codegen/*"
          - "github.com/oasdiff/*"
      go-database:
        patterns:
          - "github.com/jackc/*"
          - "github.com/lib/pq"
          - "github.com/sqlc-dev/*"
      go-crypto-image:
        patterns:
          - "golang.org/x/crypto"
          - "golang.org/x/image"
      go-others:
        patterns:
          - "*"
