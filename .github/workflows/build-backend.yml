name: Build Backend

on:
  workflow_call:
    inputs:
      push:
        description: "Push image to GHCR"
        type: boolean
        default: false
      platform:
        description: "Docker platform"
        type: string
        default: "linux/amd64"
      tag:
        description: "Image tag (required when push is true)"
        type: string
        default: ""
      channel:
        description: "Release channel (stable/canary/none)"
        type: string
        default: "none"
      build_commit:
        description: "Short commit hash to embed in image"
        type: string
        default: ""
      build_branch:
        description: "Branch name to embed in image"
        type: string
        default: ""

jobs:
  build:
    name: Build Backend
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ciel-backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The runner is discarded; removing the builder took up to 142s.
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        continue-on-error: ${{ !inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use the action rather than `docker buildx` in a run step: type=gha needs
      # the Actions runtime token, which run steps do not receive.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          platforms: ${{ inputs.platform }}
          build-args: |
            BUILD_COMMIT=${{ inputs.build_commit }}
            BUILD_BRANCH=${{ inputs.build_branch }}
          # Keyed on the runner arch because the build stage runs on $BUILDPLATFORM.
          cache-from: type=gha,scope=backend-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ runner.arch }}
          outputs: ${{ !inputs.push && 'type=cacheonly' || '' }}
          push: ${{ inputs.push }}
          tags: |
            ${{ inputs.tag != '' && format('{0}:{1}', env.BACKEND_IMAGE, inputs.tag) || '' }}
            ${{ inputs.channel == 'canary' && format('{0}:canary', env.BACKEND_IMAGE) || '' }}
            ${{ inputs.channel == 'stable' && format('{0}:stable', env.BACKEND_IMAGE) || '' }}
            ${{ inputs.channel == 'stable' && format('{0}:latest', env.BACKEND_IMAGE) || '' }}

      - name: Prune BuildKit cache
        if: inputs.push
        run: docker buildx prune --keep-storage=10gb --force
