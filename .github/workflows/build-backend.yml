name: Build Backend

on:
  workflow_call:
    inputs:
      push:
        description: "Push image to GHCR"
        type: boolean
        default: false
      platform:
        description: "Docker platform"
        type: string
        default: "linux/amd64"
      tag:
        description: "Image tag (required when push is true)"
        type: string
        default: ""
      channel:
        description: "Release channel (stable/canary/none)"
        type: string
        default: "none"
      build_commit:
        description: "Short commit hash to embed in image"
        type: string
        default: ""
      build_branch:
        description: "Branch name to embed in image"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ciel-backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        continue-on-error: ${{ !inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (CI check, no push)
        if: ${{ !inputs.push }}
        run: |
          docker buildx build \
            --platform "${{ inputs.platform }}" \
            --file Dockerfile.backend \
            --build-arg BUILD_COMMIT="${{ inputs.build_commit }}" \
            --build-arg BUILD_BRANCH="${{ inputs.build_branch }}" \
            --cache-from "type=gha,scope=backend" \
            --cache-to "type=gha,mode=max,scope=backend" \
            --output "type=cacheonly" \
            .

      - name: Build and push
        if: inputs.push
        run: |
          EXTRA_TAGS=()
          case "${{ inputs.channel }}" in
            stable) EXTRA_TAGS+=(--tag "${BACKEND_IMAGE}:stable" --tag "${BACKEND_IMAGE}:latest") ;;
            canary) EXTRA_TAGS+=(--tag "${BACKEND_IMAGE}:canary") ;;
          esac

          docker buildx build \
            --platform "${{ inputs.platform }}" \
            --file Dockerfile.backend \
            --build-arg BUILD_COMMIT="${{ inputs.build_commit }}" \
            --build-arg BUILD_BRANCH="${{ inputs.build_branch }}" \
            --cache-from "type=gha,scope=backend" \
            --cache-to "type=gha,mode=max,scope=backend" \
            --tag "${BACKEND_IMAGE}:${{ inputs.tag }}" \
            "${EXTRA_TAGS[@]}" \
            --push \
            .

      - name: Prune BuildKit cache
        if: inputs.push
        run: docker buildx prune --keep-storage=10gb --force
