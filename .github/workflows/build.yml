name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target (frontend/backend/both)"
        required: true
        default: "both"
        type: choice
        options:
          - frontend
          - backend
          - both
      platform:
        description: "Docker platform"
        required: true
        default: "linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      tag:
        description: "Docker image tag"
        required: false
        default: ""
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "canary"
        type: choice
        options:
          - stable
          - canary
          - none

permissions:
  contents: read
  packages: write

jobs:
  set-tag:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      build_commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Set image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "${INPUT_TAG}" ]; then
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: set-tag
    if: github.event.inputs.build_target == 'backend' || github.event.inputs.build_target == 'both'
    uses: ./.github/workflows/build-backend.yml
    with:
      push: true
      platform: ${{ github.event.inputs.platform }}
      tag: ${{ needs.set-tag.outputs.tag }}
      channel: ${{ github.event.inputs.channel }}
      build_commit: ${{ needs.set-tag.outputs.build_commit }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  build-frontend:
    needs: set-tag
    if: github.event.inputs.build_target == 'frontend' || github.event.inputs.build_target == 'both'
    uses: ./.github/workflows/build-frontend.yml
    with:
      push: true
      platform: ${{ github.event.inputs.platform }}
      tag: ${{ needs.set-tag.outputs.tag }}
      channel: ${{ github.event.inputs.channel }}
      build_commit: ${{ needs.set-tag.outputs.build_commit }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit
