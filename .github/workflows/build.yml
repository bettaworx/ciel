name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target (frontend/backend/both)"
        required: true
        default: "both"
        type: choice
        options:
          - frontend
          - backend
          - both
      platform:
        description: "Docker platform"
        required: true
        default: "linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      tag:
        description: "Docker image tag"
        required: false
        default: ""
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "canary"
        type: choice
        options:
          - stable
          - canary
          - none

permissions:
  contents: read
  packages: write

jobs:
  docker-release:
    name: Docker Build and Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ciel-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ciel-frontend
      BUILD_TARGET: ${{ github.event.inputs.build_target || inputs.build_target || 'both' }}
      PLATFORM: ${{ github.event.inputs.platform || inputs.platform || 'linux/arm64' }}
      INPUT_TAG: ${{ github.event.inputs.tag || inputs.tag || '' }}
      CHANNEL: ${{ github.event.inputs.channel || inputs.channel || 'canary' }}
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tag
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "TAG=${INPUT_TAG}" >> "$GITHUB_ENV"
          else
            echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: env.BUILD_TARGET == 'backend' || env.BUILD_TARGET == 'both'
        run: |
          EXTRA_TAGS=()
          case "$CHANNEL" in
            stable) EXTRA_TAGS+=(--tag "${BACKEND_IMAGE}:stable" --tag "${BACKEND_IMAGE}:latest") ;;
            canary) EXTRA_TAGS+=(--tag "${BACKEND_IMAGE}:canary") ;;
            none) ;;
          esac

          docker buildx build \
            --platform "${PLATFORM}" \
            --file Dockerfile.backend \
            --build-arg BUILD_COMMIT="${BUILD_COMMIT}" \
            --build-arg BUILD_BRANCH="${BUILD_BRANCH}" \
            --cache-from "type=registry,ref=${BACKEND_IMAGE}:canary" \
            --cache-from "type=registry,ref=${BACKEND_IMAGE}:latest" \
            --cache-to "type=inline" \
            --tag "${BACKEND_IMAGE}:${TAG}" \
            "${EXTRA_TAGS[@]}" \
            --push \
            .

      - name: Build and push frontend
        if: env.BUILD_TARGET == 'frontend' || env.BUILD_TARGET == 'both'
        run: |
          EXTRA_TAGS=()
          case "$CHANNEL" in
            stable) EXTRA_TAGS+=(--tag "${FRONTEND_IMAGE}:stable" --tag "${FRONTEND_IMAGE}:latest") ;;
            canary) EXTRA_TAGS+=(--tag "${FRONTEND_IMAGE}:canary") ;;
            none) ;;
          esac

          docker buildx build \
            --platform "${PLATFORM}" \
            --file Dockerfile.frontend \
            --build-arg BUILD_COMMIT="${BUILD_COMMIT}" \
            --build-arg BUILD_BRANCH="${BUILD_BRANCH}" \
            --cache-from "type=registry,ref=${FRONTEND_IMAGE}:canary" \
            --cache-from "type=registry,ref=${FRONTEND_IMAGE}:latest" \
            --cache-to "type=inline" \
            --tag "${FRONTEND_IMAGE}:${TAG}" \
            "${EXTRA_TAGS[@]}" \
            --push \
            .

      - name: Prune BuildKit cache
        run: docker buildx prune --keep-storage=10gb --force
