name: Release

# Releases a commit of main and builds its images for linux/amd64 and linux/arm64.
# - canary: run on main. Tags <version>-canary.<n> as a GitHub prerelease and points
#   :canary at its images. Without a version input, <version> is the one the unreleased
#   canaries are for, or the next patch after the latest stable release.
# - stable: run on main or on a canary tag. Only a commit that already has a canary
#   release can become stable, and <version> comes from that canary. Tags <version> as
#   the latest release and points :stable and :latest at its images, built again so
#   they embed the stable version.
# The channel tags move only after every image is pushed and the release exists.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: canary
        type: choice
        options:
          - canary
          - stable
      version:
        description: "Canary only: the version to release (YYYY.N.N). Empty: picked automatically"
        required: false
        default: ""
        type: string

# Two runs at once would pick the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      previous: ${{ steps.tag.outputs.previous }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Every tag is needed to pick the version and the previous release.
          fetch-depth: 0

      - name: Decide the release tag
        id: tag
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          stable_re='^[0-9]{4}\.[0-9]+\.[0-9]+$'
          latest=$(git tag -l | grep -E "$stable_re" | sort -V | tail -1)
          if [ "$CHANNEL" = stable ]; then
            canary=$(git tag --points-at HEAD -l '*-canary.*' | sort -V | tail -1)
            if [ -z "$canary" ]; then
              echo "::error::${GITHUB_SHA::7} has no canary release; release it as canary first"
              exit 1
            fi
            version=${canary%-canary.*}
            if [ -n "$VERSION" ] && [ "$VERSION" != "$version" ]; then
              echo "::error::this commit is $canary, so it can only become $version"
              exit 1
            fi
            tag=$version
            previous=$latest
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::release canaries from main"
              exit 1
            fi
            version=$VERSION
            if [ -z "$version" ]; then
              # The newest version with a release on either channel. Once it is
              # stable, the next canaries are for its next patch.
              version=$(git tag -l | sed 's/-canary\.[0-9]*$//' | grep -E "$stable_re" | sort -V | tail -1)
              if [ "$version" = "$latest" ]; then
                version=${version%.*}.$((${version##*.} + 1))
              fi
            fi
            n=$(git tag -l "$version-canary.*" | sed 's/.*\.//' | sort -n | tail -1)
            tag=$version-canary.$((n + 1))
            previous=$(git describe --tags --abbrev=0 --match '[0-9]*' 2> /dev/null) || true
          fi
          if ! [[ $version =~ $stable_re ]]; then
            echo "::error::$version is not YYYY.N.N (e.g. 2026.1.4)"
            exit 1
          fi
          # Releasing an older version would move :stable backwards.
          if [ "$version" = "$latest" ] ||
            [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::$version is not newer than the latest stable release $latest"
            exit 1
          fi
          echo "::notice::releasing ${GITHUB_SHA::7} as $tag"
          {
            echo "tag=$tag"
            echo "previous=$previous"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-backend.yml
    with:
      push: true
      platform: linux/amd64,linux/arm64
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.tag }}
      build_commit: ${{ needs.prepare.outputs.commit }}
      # A stable run may start from a canary tag, so github.ref_name is not always main.
      build_branch: main
    secrets: inherit

  build-frontend:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-frontend.yml
    with:
      push: true
      platform: linux/amd64,linux/arm64
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.tag }}
      build_commit: ${{ needs.prepare.outputs.commit }}
      build_branch: main
    secrets: inherit

  publish:
    name: Publish the release
    needs: [prepare, build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skips a release that already exists, so a failed run can be re-run.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          if [ "$CHANNEL" = stable ]; then kind=--latest; else kind=--prerelease; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} $kind

      - name: Point the channel tags at the new images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in ciel-backend ciel-frontend; do
            ref=ghcr.io/$OWNER/$image
            tags=(-t "$ref:$CHANNEL")
            if [ "$CHANNEL" = stable ]; then
              tags+=(-t "$ref:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$ref:$TAG"
          done
