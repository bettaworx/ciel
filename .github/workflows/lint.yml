name: Lint

on:
  push:

jobs:
  lint-backend:
    name: Backend (Go) Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod

      - name: Cache generated code
        id: gen-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/backend/internal/db/sqlc/*.go
            apps/backend/internal/api/*.go
            packages/api/openapi.bundled.yml
          key: go-generate-${{ hashFiles('apps/backend/db/schema.sql', 'apps/backend/db/queries*.sql', 'apps/backend/sqlc.yaml', 'apps/backend/oapi-codegen.yaml', 'packages/api/openapi.yml') }}

      - name: Generate code
        if: steps.gen-cache.outputs.cache-hit != 'true'
        working-directory: apps/backend
        run: go generate ./...

      - name: Build (warm module and build cache)
        working-directory: apps/backend
        run: go build ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: apps/backend
          args: --path-prefix=apps/backend

  lint-frontend:
    name: Frontend (TypeScript) Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
        working-directory: apps/frontend
